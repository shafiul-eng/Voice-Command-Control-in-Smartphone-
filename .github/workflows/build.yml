name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o VoiceControl.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build debug APK
        working-directory: VoiceControl
        run: gradle assembleDebug --no-daemon
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp VoiceControl/app/build/outputs/apk/debug/app-debug.apk VoiceControl.apk
          gh release create "v${{ github.run_number }}" VoiceControl.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
